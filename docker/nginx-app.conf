# ──────────────────────────────────────────────────────────────
# nginx config for the OPERATOR frontend (packages/app) ONLY.
# Do NOT reuse the shared docker/nginx-spa.conf (admin-frontend +
# auth-frontend use that) — this image additionally serves the plugin
# runtime (/vendor + /plugins) and ships an enforced CSP.
#   * Static serving only — path routing happens at the INGRESS, which strips
#     the app's base path (/<app>) first: /<app>/api + /<app>/health → engine,
#     /<app>/ → this SPA at its root. The IdP, jobs and report stand under their
#     own paths of the same host; the page finds them in /env.js, written at
#     container start (docker/app-env.sh).
#   * /vendor : content-hashed shared ESM (react, react-router, @digitaplatform/plugins) → immutable.
#   * /plugins: FREE plugin artifacts, version-addressed
#     (/plugins/<id>/<version>/<entry> → immutable) plus the inventory
#     /plugins/index.json → no-cache, so a redeploy's new plugin set is
#     picked up at once while the versioned bytes cache forever.
#   * PREMIUM plugin bytes are NOT served here: the SPA requests them from
#     /api/v1/plugin-assets/... which the INGRESS proxies to the ENGINE — the
#     engine streams them from PLUGINS_PREMIUM_DIR (engine env) only after
#     verifying the tenant's license entitlements. /plugins-premium/ is
#     hard-404'd below as defense-in-depth.
#   * Listens on 8080 → runs as non-root `nginx` (pid + temp under /tmp).
# ──────────────────────────────────────────────────────────────

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;

  # Non-root friendly: every writable path lives under /tmp.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Per-path Cache-Control as a variable so the server-level add_header set below
  # stays intact in every location. (An add_header inside a location would drop
  # ALL inherited add_headers — incl. the CSP — so locations set NO add_header;
  # cache policy is driven here instead.)
  #   hashed assets / vendor ESM / version-addressed plugin artifacts →
  #   immutable; everything else → revalidate. Plugin artifacts live at
  #   /plugins/<id>/<version>/<entry> — the version segment makes the URL
  #   content-stable, so it may cache forever; the /plugins/index.json
  #   inventory (and any legacy unversioned path) keeps the no-cache default
  #   so a redeployed plugin set takes effect immediately.
  map $uri $digita_cache_control {
    default                         "no-cache";
    "~^/assets/"                    "public, max-age=31536000, immutable";
    "~^/vendor/"                    "public, max-age=31536000, immutable";
    "~^/plugins/[^/]+/[0-9]+\.[0-9]+\.[0-9]+[^/]*/"  "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to EVERY response (locations below set no add_header,
    # so they inherit these). The page calls the tenant IdP, jobs and report at the
    # URLs of its env: under paths of the tenant's one host, or on hosts of their own
    # while a tenant is routed by host. connect-src and frame-src therefore allow
    # exactly their origins beside 'self' — docker/app-env.sh fills the placeholder
    # from AUTH_URL, JOBS_URL and REPORT_URL at container start.
    # script-src pins the INLINE import map by its per-build sha256 — the placeholder
    # __IMPORTMAP_SHA256__ is replaced at image build from dist/csp-importmap-sha256.txt
    # (see docker/app.Dockerfile). NO 'unsafe-inline': the import map is the only
    # inline script and the vite build asserts that. style-src keeps 'unsafe-inline'
    # for Tailwind + inline style attributes (separate, lower-risk axis).
    # base-uri 'self' admits the <base href> of the app's base path.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__IMPORTMAP_SHA256__'; connect-src 'self' __SERVICE_ORIGINS__; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src 'self' __SERVICE_ORIGINS__; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $digita_cache_control always;

    # Plain liveness/readiness target for kubernetes probes.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Hashed build assets — immutable (via the cache map).
    location /assets/ {
      try_files $uri =404;
    }

    # Shared vendor ESM — content-hashed filenames → immutable (via the map).
    location /vendor/ {
      types { application/javascript js; }
      try_files $uri =404;
    }

    # FREE plugin artifacts (version-addressed) + the /plugins/index.json
    # inventory the host joins against GET /api/v1/plugins. The `types {}`
    # block REPLACES the inherited mime table inside this location, so every
    # staged extension must be listed: .js/.mjs (component plugin ESM),
    # .css (design plugin stylesheets), .json (inventory + plugin manifests).
    # Cache policy comes from the $digita_cache_control map above: versioned
    # artifact paths are immutable, index.json revalidates on every request.
    location /plugins/ {
      types {
        application/javascript js mjs;
        application/json json;
        text/css css;
      }
      try_files $uri =404;
    }

    # PREMIUM plugin bytes are NEVER served by nginx — entitlement gating lives
    # in the ENGINE: the ingress proxies /api/v1/plugin-assets/<id>/<ver>/<file>
    # to the engine, which streams the file from PLUGINS_PREMIUM_DIR (engine
    # env, owned by the engine image/chart) only for tenants whose verified
    # license lists the plugin id. Hard-404 the staged dir name here as
    # defense-in-depth in case premium bytes ever land in a web root (they are
    # stripped from free-tier images by the app.Dockerfile deploy guard).
    location /plugins-premium/ {
      return 404;
    }

    # SPA fallback: the client-side router owns every other path. index.html +
    # import-map.json are no-cache (via the map) so deploys take effect at once.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
