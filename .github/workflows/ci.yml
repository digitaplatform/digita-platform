name: ci

# Build and test of the publishable foundation packages (shared, theme,
# components, plugins), a full gate for the engine (typecheck, dependency
# rules, build, and the vitest suite), and the gates of the two frontends: the
# app (lint, typecheck, tests, build) and the web site (typecheck, tests,
# build, and its image from docker/web.Dockerfile).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The Release workflow commits a release with GITHUB_TOKEN, and GitHub starts no workflow from such
  # a push. This runs the gates after every release as well; for this event the checkout is the head
  # of master, which is the release commit. Packages are published only by the Release workflow's
  # publish job.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the publishable foundation packages
        run: >-
          pnpm
          --filter '@digitaplatform/shared'
          --filter '@digitaplatform/theme'
          --filter '@digitaplatform/components'
          --filter '@digitaplatform/plugins'
          build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test shared, the theme and the component kit
        run: pnpm --filter '@digitaplatform/shared' --filter '@digitaplatform/theme' --filter '@digitaplatform/components' test

  # The app's gate: lint (eslint --max-warnings 0, type-aware over src and tests), typecheck,
  # tests and the production build. It resolves the workspace packages' types, so the foundation
  # packages are built first; the build needs the vendor bundles build:vendor writes.
  app:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the foundation packages
        run: >-
          pnpm
          --filter '@digitaplatform/shared'
          --filter '@digitaplatform/theme'
          --filter '@digitaplatform/components'
          --filter '@digitaplatform/plugins'
          build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint the app
        run: pnpm --filter '@digitaplatform/app' lint
      - name: Typecheck the app
        run: pnpm --filter '@digitaplatform/app' typecheck
      # The tests read the build's texts as its pod does, from TRANSLATIONS_DIR: its folder of
      # digitaplatform/digita-translations master, never a copy kept here. A literal key the code
      # names and that folder's en.json lacks turns the tests red.
      - name: Download digitaplatform/digita-translations master
        run: |
          mkdir -p "$RUNNER_TEMP/digita-translations"
          curl -fsSL https://codeload.github.com/digitaplatform/digita-translations/tar.gz/master \
            | tar -xz -C "$RUNNER_TEMP/digita-translations" --strip-components=1
      - name: Test the app
        run: pnpm --filter '@digitaplatform/app' test
        env:
          TRANSLATIONS_DIR: ${{ runner.temp }}/digita-translations/translations/digita-app
      - name: Build the app
        run: >-
          pnpm --filter '@digitaplatform/app' build:vendor &&
          pnpm --filter '@digitaplatform/app' build

  # The web site's gate: typecheck, tests (among them the guard that it carries no design value of
  # its own) and the production build, over the built foundation packages it renders with.
  web:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the foundation packages
        run: >-
          pnpm
          --filter '@digitaplatform/shared'
          --filter '@digitaplatform/theme'
          --filter '@digitaplatform/components'
          --filter '@digitaplatform/plugins'
          build
      - name: Typecheck the web site
        run: pnpm --filter '@digitaplatform/web' typecheck
      # The tests read the build's texts as its pod does, from TRANSLATIONS_DIR: its folder of
      # digitaplatform/digita-translations master, never a copy kept here. A literal key the code
      # names and that folder's en.json lacks turns the tests red.
      - name: Download digitaplatform/digita-translations master
        run: |
          mkdir -p "$RUNNER_TEMP/digita-translations"
          curl -fsSL https://codeload.github.com/digitaplatform/digita-translations/tar.gz/master \
            | tar -xz -C "$RUNNER_TEMP/digita-translations" --strip-components=1
      - name: Test the web site
        run: pnpm --filter '@digitaplatform/web' test
        env:
          TRANSLATIONS_DIR: ${{ runner.temp }}/digita-translations/translations/digita-web
      - name: Build the web site
        run: pnpm --filter '@digitaplatform/web' build

  # The web site's image, built from docker/web.Dockerfile as the cluster builds it. The job above
  # installs the whole workspace, so a workspace package the site imports but the Dockerfile does
  # not install, copy or build would pass there and fail only at release; here it fails.
  web-image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the registry credential the build mounts as a secret
        run: printf '@digitaplatform:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the web image
        run: docker build -f docker/web.Dockerfile --secret id=npmrc,src="$RUNNER_TEMP/npmrc" -t digita-web:ci .

  # Engine gate: typecheck (src + tests), dependency rules (dependency-cruiser),
  # build, and the full vitest suite (unit + mongodb-memory-server replica-set
  # integration tests — each integration file boots its own 1-node replset, so
  # the runner needs egress to the mongod download mirror on a cold cache).
  engine:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build @digitaplatform/shared (the engine's workspace dependency)
        run: pnpm --filter '@digitaplatform/shared' build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck the engine (tsconfig.test.json covers src/ and tests/)
        run: pnpm --filter '@digitaplatform/engine' typecheck
      - name: Dependency rules (dependency-cruiser)
        run: pnpm --filter '@digitaplatform/engine' depcruise
      - name: Build the engine
        run: pnpm --filter '@digitaplatform/engine' build
      # The tests read the build's texts as its pod does, from TRANSLATIONS_DIR: its folder of
      # digitaplatform/digita-translations master, never a copy kept here. A literal key the code
      # names and that folder's en.json lacks turns the tests red.
      - name: Download digitaplatform/digita-translations master
        run: |
          mkdir -p "$RUNNER_TEMP/digita-translations"
          curl -fsSL https://codeload.github.com/digitaplatform/digita-translations/tar.gz/master \
            | tar -xz -C "$RUNNER_TEMP/digita-translations" --strip-components=1
      - name: Engine test suite
        run: pnpm --filter '@digitaplatform/engine' test
        env:
          TRANSLATIONS_DIR: ${{ runner.temp }}/digita-translations/translations/digita-engine
          # Mirrors the 2-fork CI scenario the vitest.config.ts isolation
          # comment documents (worker isolation must stay ON).
          VITEST_MAX_WORKERS: '2'
